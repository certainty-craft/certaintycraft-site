# certaintycraft.ca. Plain static site, no build step.
# Per-path headers (including landing-page noindex) live in _headers.

[build]
  publish = "."
  command = ""

# Netlify's post-processing rewrites .html links to extension-less urls. The
# pages carry canonical tags pointing at the .html form
# (https://certaintycraft.ca/case-studies.html), so letting it strip the
# extension would put the canonical tag and the served url out of sync.
[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Collapse duplicate url variants onto the canonical forms, so every page has
# exactly one indexable url. force = true is needed on /index.html because the
# file exists; Netlify still serves / from index.html internally, no loop.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/case-studies/:slug/index.html"
  to = "/case-studies/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/case-studies"
  to = "/case-studies.html"
  status = 301

[[redirects]]
  from = "/case-studies/"
  to = "/case-studies.html"
  status = 301

[[redirects]]
  from = "/quick-view"
  to = "/quick-view.html"
  status = 301
